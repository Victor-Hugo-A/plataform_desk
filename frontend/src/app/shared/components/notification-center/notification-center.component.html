<section class="notification-center" aria-live="polite" aria-atomic="true">
  @for (notification of notificationService.notifications$ | async; track notification.id) {
    <article class="toast" [class]="'toast toast-' + notification.type">
      <div class="toast-copy">
        <strong>{{ notification.title }}</strong>
        <p>{{ notification.message }}</p>
      </div>

      <button
        type="button"
        class="toast-close"
        (click)="notificationService.dismiss(notification.id)"
        aria-label="Fechar notificação">
        ×
      </button>
    </article>
  }
</section>
